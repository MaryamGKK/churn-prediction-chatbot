<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Churn Prediction Agent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #F4F3F5;
  --card: #ffffff;
  --primary: #E00800;
  --primary-hover: #C70700;
  --primary-soft: rgba(224, 8, 0, 0.08);
  --dark: #191329;
  --dark-lighter: #2a2240;
  --text: #242424;
  --muted: #78758a;
  --border: #E8E7EA;
  --user-bg: #191329;
  --user-text: #ffffff;
  --bot-bg: #ffffff;
  --bot-text: #242424;
  --danger: #E00800;
  --success: #00a870;
  --warning-bg: #fff8e1;
  --shadow-sm: 0 1px 3px rgba(25,19,41,0.06);
  --shadow-md: 0 4px 12px rgba(25,19,41,0.08);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: var(--dark);
  color: #fff;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  height: 60px;
  position: relative;
}

header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--primary);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 32px;
  height: 32px;
  background: var(--primary);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.5px;
}

header h1 {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.3px;
}

header h1 span {
  color: var(--primary);
  font-weight: 700;
}

.header-controls {
  display: flex;
  gap: 8px;
  align-items: center;
}

.header-controls input {
  padding: 7px 12px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  width: 170px;
  transition: all 0.2s;
}

.header-controls input:focus {
  outline: none;
  border-color: var(--primary);
  background: rgba(255,255,255,0.1);
}

.header-controls input::placeholder { color: rgba(255,255,255,0.4); }

.btn-new {
  padding: 7px 16px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  background: transparent;
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-new:hover {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.25);
}

.btn-new svg {
  width: 14px;
  height: 14px;
}

.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.chat-container::-webkit-scrollbar { width: 6px; }
.chat-container::-webkit-scrollbar-track { background: transparent; }
.chat-container::-webkit-scrollbar-thumb {
  background: rgba(25,19,41,0.15);
  border-radius: 3px;
}
.chat-container::-webkit-scrollbar-thumb:hover {
  background: rgba(25,19,41,0.25);
}

.message {
  max-width: 72%;
  padding: 12px 16px;
  border-radius: var(--radius);
  line-height: 1.55;
  font-size: 14px;
  white-space: pre-wrap;
  word-wrap: break-word;
  animation: msgIn 0.25s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user {
  align-self: flex-end;
  background: var(--user-bg);
  color: var(--user-text);
  border-bottom-right-radius: 4px;
  box-shadow: var(--shadow-sm);
}

.message.bot {
  align-self: flex-start;
  background: var(--bot-bg);
  color: var(--bot-text);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.message.error {
  align-self: center;
  background: var(--warning-bg);
  color: var(--text);
  font-size: 13px;
  max-width: 90%;
  border: 1px solid #ffe0b2;
  border-radius: 10px;
}

.message.bot h2, .message.bot h3, .message.bot h4 {
  margin: 12px 0 6px;
  font-weight: 700;
  line-height: 1.3;
}
.message.bot h2 { font-size: 16px; }
.message.bot h3 { font-size: 15px; }
.message.bot h4 { font-size: 14px; }
.message.bot h2:first-child, .message.bot h3:first-child, .message.bot h4:first-child { margin-top: 0; }
.message.bot ul {
  margin: 6px 0;
  padding-left: 18px;
  list-style: disc;
}
.message.bot ul li {
  margin: 3px 0;
  line-height: 1.5;
}
.message.bot strong { font-weight: 600; }

.message.bot .prediction-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 10px;
  letter-spacing: 0.02em;
}

.prediction-badge.churn {
  background: linear-gradient(135deg, var(--danger), #ff4444);
  color: #fff;
}

.prediction-badge.stay {
  background: linear-gradient(135deg, var(--success), #00d68f);
  color: #fff;
}

.typing {
  align-self: flex-start;
  padding: 14px 20px;
  background: var(--bot-bg);
  border-radius: var(--radius);
  border-bottom-left-radius: 4px;
  border: 1px solid var(--border);
  display: flex;
  gap: 5px;
  align-items: center;
}

.typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--primary);
  opacity: 0.4;
  animation: pulse 1.4s infinite ease-in-out;
  display: inline-block;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 60%, 100% { opacity: 0.25; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1.1); }
}

.input-area {
  flex-shrink: 0;
  padding: 16px 24px 20px;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  box-shadow: 0 -2px 10px rgba(25,19,41,0.04);
}

.input-area textarea {
  flex: 1;
  padding: 11px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  min-height: 44px;
  max-height: 120px;
  background: var(--bg);
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-area textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

.input-area textarea::placeholder { color: var(--muted); }

.input-area button {
  padding: 11px 22px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  align-self: flex-end;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.input-area button:hover {
  background: var(--primary-hover);
  box-shadow: 0 2px 8px rgba(224,8,0,0.3);
}

.input-area button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
}

.input-area button svg {
  width: 16px;
  height: 16px;
}

.welcome {
  text-align: center;
  color: var(--muted);
  margin: auto 0;
  padding: 40px 20px;
}

.welcome-icon {
  width: 64px;
  height: 64px;
  background: var(--primary-soft);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}

.welcome-icon svg {
  width: 30px;
  height: 30px;
  color: var(--primary);
}

.welcome h2 {
  font-size: 22px;
  margin-bottom: 8px;
  color: var(--dark);
  font-weight: 700;
  letter-spacing: -0.3px;
}

.welcome p {
  font-size: 14px;
  max-width: 420px;
  margin: 0 auto 24px;
  line-height: 1.6;
  color: var(--muted);
}

.quick-actions {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.quick-action {
  padding: 8px 16px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}

.quick-action:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-soft);
}

.footer-note {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 0 24px 8px;
  background: var(--card);
  opacity: 0.7;
}

@media (max-width: 600px) {
  .message { max-width: 88%; }
  header { padding: 0 16px; }
  .chat-container { padding: 14px 16px; }
  .input-area { padding: 12px 16px 16px; }
  .header-controls input { width: 110px; }
  .quick-actions { flex-direction: column; align-items: center; }
  .welcome { padding: 30px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <h1>Churn Prediction <span>Agent</span></h1>
  </div>
  <div class="header-controls">
    <input type="password" id="apiKeyInput" placeholder="API Key (optional)">
    <button class="btn-new" onclick="newSession()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Chat
    </button>
  </div>
</header>

<div class="chat-container" id="chatContainer">
  <div class="welcome">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12"/>
        <path d="M2 12A10 10 0 0 1 12 2"/>
        <path d="M8 12l2 2 4-4"/>
      </svg>
    </div>
    <h2>Customer Churn Prediction</h2>
    <p>Assess customer churn risk through conversation. Provide customer details and get AI-powered predictions with actionable insights.</p>
    <div class="quick-actions">
      <button class="quick-action" onclick="sendQuickAction('I want to assess a customer for churn risk')">Assess a Customer</button>
      <button class="quick-action" onclick="sendQuickAction('Show me the overall churn data overview')">Data Overview</button>
      <button class="quick-action" onclick="sendQuickAction('What are the high risk customer segments?')">High-Risk Segments</button>
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="messageInput" placeholder="Ask about a customer or churn data..." rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
  <button id="sendBtn" onclick="sendMessage()">
    Send
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<div class="footer-note">Powered by AI &mdash; predictions are estimates based on historical data</div>

<script>
var sessionId = crypto.randomUUID();

function getApiKey() {
  return document.getElementById('apiKeyInput').value.trim();
}

function newSession() {
  sessionId = crypto.randomUUID();
  const container = document.getElementById('chatContainer');
  container.innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12"/>
          <path d="M2 12A10 10 0 0 1 12 2"/>
          <path d="M8 12l2 2 4-4"/>
        </svg>
      </div>
      <h2>Customer Churn Prediction</h2>
      <p>Assess customer churn risk through conversation. Provide customer details and get AI-powered predictions with actionable insights.</p>
      <div class="quick-actions">
        <button class="quick-action" onclick="sendQuickAction('I want to assess a customer for churn risk')">Assess a Customer</button>
        <button class="quick-action" onclick="sendQuickAction('Show me the overall churn data overview')">Data Overview</button>
        <button class="quick-action" onclick="sendQuickAction('What are the high risk customer segments?')">High-Risk Segments</button>
      </div>
    </div>`;
}

function sendQuickAction(text) {
  document.getElementById('messageInput').value = text;
  sendMessage();
}

function renderMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
    .replace(/\n/g, '<br>');
  html = html.replace(/((?:<li>.*?<\/li><br>?)+)/g, '<ul>$1</ul>');
  html = html.replace(/<ul><br>/g, '<ul>').replace(/<br><\/ul>/g, '</ul>');
  html = html.replace(/<\/li><br><li>/g, '</li><li>');
  return html;
}

function addMessage(role, text, prediction) {
  const container = document.getElementById('chatContainer');
  const welcome = container.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'message ' + role;

  if (role === 'bot') {
    div.innerHTML = renderMarkdown(text);
  } else {
    div.textContent = text;
  }

  if (prediction && role === 'bot') {
    const badge = document.createElement('div');
    badge.className = 'prediction-badge ' + (prediction.churn_prediction ? 'churn' : 'stay');
    badge.textContent = prediction.churn_prediction
      ? `Churn Risk: ${(prediction.churn_probability * 100).toFixed(1)}%`
      : `Likely to Stay: ${((1 - prediction.churn_probability) * 100).toFixed(1)}%`;
    div.appendChild(badge);
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;

  showTyping();

  try {
    const headers = { 'Content-Type': 'application/json' };
    const key = getApiKey();
    if (key) headers['X-API-Key'] = key;

    const res = await fetch('/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    hideTyping();

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      addMessage('error', `Error ${res.status}: ${err.detail || JSON.stringify(err)}`);
      return;
    }

    const data = await res.json();
    addMessage('bot', data.response, data.prediction);
  } catch (e) {
    hideTyping();
    addMessage('error', 'Connection error: ' + e.message);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

document.getElementById('messageInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
